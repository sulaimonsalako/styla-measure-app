# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Styla Fit Engine"
client_id = "ae97233671ed9354af95498cd5c7fc62"
# Production. The app server runs on Render (service styla-shopify-app, Ohio,
# Starter) behind our own domain rather than the onrender.com subdomain, so the
# host can be changed later without re-registering the app with Shopify and
# reinstalling on every store.
application_url = "https://app.styla.ca"
embedded = true

[webhooks]
# 2024-04 went out of support in April 2025. Stable versions live 12 months;
# 2026-07 is current. Review rejects an unsupported version.
api_version = "2026-07"

# MANDATORY for every app distributed through the Shopify App Store, whether or
# not it touches customer data. Unlike our product/inventory webhooks (registered
# over the API at install time in web/index.js), the three compliance topics are
# declared HERE and applied with `shopify app deploy` — you cannot register them
# from the Admin API. Missing them is an automatic review rejection.
#
# All three land on the same endpoint, which verifies HMAC and returns 200.
[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/api/webhooks"

[pos]
embedded = false

[access_scopes]
# Minimal — the app only READS. Chart assignments live in Styla's DB; shoppers auth
# via Continue-with-Styla, not Shopify customers. Add read_orders/read_customers/
# write_products only when a feature actually needs them (incremental re-consent).
#   read_themes — needed ONLY to check whether the merchant has actually placed the
#   widget block in their live theme. Read-only: we never write to a theme.
scopes = "read_products,read_inventory,read_shipping,read_themes"

[auth]
redirect_urls = [
  "https://app.styla.ca/api/auth/callback"
]

[build]
# false, deliberately. With this on, every `shopify app dev` rewrites
# application_url and redirect_urls to that session's throwaway tunnel and
# pushes it -- which is how the production URL became a loca.lt address in the
# first place. Local development now runs against the tunnel without touching
# the released configuration.
automatically_update_urls_on_dev = false
